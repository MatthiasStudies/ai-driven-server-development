services:
  postgres:
    image: postgres:18-alpine
    container_name: tcg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg_user
      POSTGRES_PASSWORD: tcg_password
      POSTGRES_DB: tcg_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg_user -d tcg_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: