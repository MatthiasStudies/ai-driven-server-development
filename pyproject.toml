[project]
name = "tcg-card-stack"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.15.2",
    "pytest==9.0.2",
    "ty==0.0.18",
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # Errors
    "F", # Pyflakes
    "W", # Warnings
    "C90", # Complexity
    "ANN", # Annotations
    "RUF", # Ruff
    "TID", # flake8 tidy imports
]