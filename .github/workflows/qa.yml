name: QA

on:
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Static analysis, code style & typechecking
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Static analysis (ruff check)
        run: uv run ruff check .

      - name: Code style (ruff format --check)
        run: uv run ruff format --check .

      - name: Typechecking (ty)
        run: uv run ty check
